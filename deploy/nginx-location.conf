        # Отчёт по аттестации: отдельный сервис attestation-report-service, вход учётной записью РИТМ
        location /attestation {
            # через переменную: nginx поднимется и без контейнера attestation-report
            set $attestation http://attestation-report:8002;
            proxy_pass $attestation;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            # сервис ограничивает входы по последнему адресу в цепочке — его и дописывает nginx
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            client_max_body_size 1M;
            proxy_read_timeout 300s;
        }

