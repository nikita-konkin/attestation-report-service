# Сервер 192.168.50.117: контейнер в общей сети с nginx сайта (mynetwork из ssl-nginx-docker).
# Том — тот, что сервис занимал внутри ssl-nginx-docker: выбранные кафедрами направления групп
# переезжают вместе с ним. Для новой установки имя тома задаёт ATTESTATION_VOLUME.
services:
    attestation:
        networks:
            - mynetwork

networks:
    mynetwork:
        external: true

volumes:
    attestation-data:
        external: true
        name: ${ATTESTATION_VOLUME:-ssl-nginx-docker_attestation-data}
